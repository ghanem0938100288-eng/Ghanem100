<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>عجلة الأكوس شي</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            background: radial-gradient(circle at center, #2b0b3f 0%, #0d0214 70%, #050008 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
        }
        .header-brand {
            font-size: 22px;
            font-weight: 900;
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.8);
            margin-top: 5px;
        }
        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* إطار البرق التجميلي المحيط بالعجلة */
        .lightning-glow {
            position: absolute;
            width: 345px;
            height: 345px;
            border-radius: 50%;
            border: 2px dashed #00e1ff;
            box-shadow: 0 0 20px #00ffff, inset 0 0 20px #ff00ff;
            animation: pulseGlow 2s infinite alternate;
            pointer-events: none;
            z-index: 5;
        }
        @keyframes pulseGlow {
            from { opacity: 0.6; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1.02); }
        }
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 28px solid #ff2a5f;
            filter: drop-shadow(0 0 8px #ff2a5f);
            z-index: 15;
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid #d98218;
            box-shadow: 0 0 30px rgba(217, 130, 24, 0.8), inset 0 0 20px rgba(0,0,0,0.9);
        }
        .center-btn {
            position: absolute;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffe066 0%, #d98218 80%, #613400 100%);
            border: 3px solid #ffffff;
            color: #3b0a45;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0,0,0,0.9);
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }
        .center-btn:active { transform: scale(0.9); }
        .center-btn.disabled {
            background: #444;
            border-color: #777;
            color: #aaa;
            cursor: not-allowed;
        }
        .footer-info {
            width: 100%;
            padding-bottom: 10px;
        }
        .title-sec {
            font-size: 26px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
            margin-bottom: 5px;
        }
        .status-msg {
            font-size: 16px;
            font-weight: bold;
            color: #ffcc00;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            min-height: 40px;
            padding: 0 15px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="header-brand">AKUAS SHE BOT 👑</div>

    <div class="wheel-container">
        <div class="lightning-glow"></div>
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="400" height="400"></canvas>
        <button id="spinBtn" class="center-btn" onclick="startSpin()">أدر</button>
    </div>

    <div class="footer-info">
        <div class="title-sec">عجلة الاكوس شي</div>
        <div id="statusMsg" class="status-msg">اضغط على زر (أدر) في المنتصف لتجربة حظك!</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const canSpin = urlParams.get('can_spin') === '1';
        const reason = urlParams.get('reason') || '';
        const targetPrize = parseFloat(urlParams.get('prize') || '0');

        const spinBtn = document.getElementById('spinBtn');
        const statusMsg = document.getElementById('statusMsg');

        // شرائح العجلة المطابقة تماماً للصورة الأسطورية
        const sectors = [
            { label: "1000 NSP", value: 1000, color: "#9e9e9e", textColor: "#ffffff" },
            { label: "5000 NSP", value: 5000, color: "#4a0e5c", textColor: "#ffcc00" },
            { label: "Hard luck", value: 0, color: "#9e9e9e", textColor: "#ffffff" },
            { label: "10 NSP", value: 10, color: "#4a0e5c", textColor: "#ffffff" },
            { label: "150 NSP", value: 150, color: "#9e9e9e", textColor: "#ffffff" },
            { label: "50 NSP", value: 50, color: "#4a0e5c", textColor: "#ffffff" },
            { label: "250 NSP", value: 250, color: "#9e9e9e", textColor: "#ffffff" },
            { label: "100 NSP", value: 100, color: "#4a0e5c", textColor: "#ffffff" },
            { label: "20 NSP", value: 20, color: "#4a0e5c", textColor: "#ffffff" },
            { label: "500 NSP", value: 500, color: "#4a0e5c", textColor: "#ffffff" }
        ];

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const center = canvas.width / 2;
        const arc = (2 * Math.PI) / sectors.length;
        let currentRotation = 0;
        let isSpinning = false;

        function drawWheel(rotationAngle) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(center, center);
            ctx.rotate(rotationAngle);

            for (let i = 0; i < sectors.length; i++) {
                const startAngle = -Math.PI / 2 + i * arc;
                const endAngle = startAngle + arc;

                ctx.beginPath();
                ctx.fillStyle = sectors[i].color;
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, center - 6, startAngle, endAngle);
                ctx.closePath();
                ctx.fill();

                ctx.lineWidth = 2;
                ctx.strokeStyle = "#2b0536";
                ctx.stroke();

                ctx.save();
                ctx.rotate(startAngle + arc / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = sectors[i].textColor;
                ctx.font = "bold 17px Tahoma";
                ctx.fillText(sectors[i].label, center - 28, 6);
                ctx.restore();
            }
            ctx.restore();
        }

        drawWheel(0);

        if (!canSpin) {
            spinBtn.classList.add('disabled');
            spinBtn.innerText = "🚫";
            if (reason === 'used') {
                statusMsg.innerText = "لقد استنفذت عدد المرات المسموحة للـيوم.";
            } else if (reason === 'no_deposit') {
                statusMsg.innerText = "ليتم منحك فرصة في عجلة الحظ، يجب أن تقوم بشحن حسابك بالبوت بمبلغ 100 على الأقل.";
            } else {
                statusMsg.innerText = "لا تتوفر لديك محاولات حالياً.";
            }
        }

        function startSpin() {
            if (!canSpin || isSpinning) return;
            isSpinning = true;
            spinBtn.classList.add('disabled');
            statusMsg.innerText = "جاري تدوير العجلة... بالتوفيق! 🍀";

            let targetIndex = sectors.findIndex(s => s.value === targetPrize);
            if (targetIndex === -1) {
                targetIndex = targetPrize > 0 ? 5 : 2; 
            }

            const sliceCenterAngle = targetIndex * arc + arc / 2;
            const stopAngle = (2 * Math.PI) - sliceCenterAngle;
            const extraSpins = 7 * 2 * Math.PI; 
            const totalRotation = extraSpins + stopAngle;

            const duration = 4500;
            const startTime = performance.now();

            function animate(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 4);
                currentRotation = totalRotation * easeOut;

                drawWheel(currentRotation);

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    if (targetPrize > 0) {
                        statusMsg.style.color = "#00ffcc";
                        statusMsg.innerText = `🎉 مبروك! لقد ربحت ${targetPrize} NSP!`;
                    } else {
                        statusMsg.style.color = "#ff6b6b";
                        statusMsg.innerText = "😔 حظ أوفر في المرة القادمة (Hard luck)!";
                    }

                    setTimeout(() => {
                        tg.sendData(JSON.stringify({
                            action: "wheel_spun",
                            prize: targetPrize
                        }));
                    }, 2200);
                }
            }
            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
