<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>عجلة الأكوس شي</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            background: #0d0214;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 5px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .main-container {
            position: relative;
            width: 340px;
            height: 340px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* صورة العجلة الأسطورية المأخوذة من تصميمك */
        .wheel-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 0 25px rgba(0, 225, 255, 0.6);
            transition: transform 4.5s cubic-bezier(0.15, 0.85, 0.15, 1);
        }
        .center-btn {
            position: absolute;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffe066 0%, #d98218 80%, #613400 100%);
            border: 3px solid #ffffff;
            color: #3b0a45;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0,0,0,0.9);
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .center-btn.disabled {
            background: #444;
            border-color: #777;
            color: #aaa;
            cursor: not-allowed;
        }
        .title-sec {
            font-size: 24px;
            font-weight: 900;
            color: #ffcc00;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
            margin-top: 15px;
        }
        .status-msg {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            margin-top: 10px;
            padding: 0 15px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- رابط الصورة الأسطورية التي أرسلتها -->
        <img id="wheelImg" class="wheel-img" src="Ghan.jpg" alt="عجلة الأكوس شي">
        <button id="spinBtn" class="center-btn" onclick="startSpin()">أدر</button>
    </div>

    <div class="title-sec">عجلة الاكوس شي 👑</div>
    <div id="statusMsg" class="status-msg">اضغط على زر (أدر) في المنتصف لتجربة حظك!</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const canSpin = urlParams.get('can_spin') === '1';
        const reason = urlParams.get('reason') || '';
        const targetPrize = parseFloat(urlParams.get('prize') || '0');

        const spinBtn = document.getElementById('spinBtn');
        const statusMsg = document.getElementById('statusMsg');
        const wheelImg = document.getElementById('wheelImg');

        let currentDegrees = 0;
        let isSpinning = false;

        if (!canSpin) {
            spinBtn.classList.add('disabled');
            spinBtn.innerText = "🚫";
            if (reason === 'used') {
                statusMsg.innerText = "لقد استنفذت عدد المرات المسموحة للـيوم.";
            } else if (reason === 'no_deposit') {
                statusMsg.innerText = "ليتم منحك فرصة في عجلة الحظ، يجب أن تقوم بشحن حسابك بالبوت بمبلغ 100 على الأقل.";
            } else {
                statusMsg.innerText = "لا تتوفر لديك محاولات حالياً.";
            }
        }

        function startSpin() {
            if (!canSpin || isSpinning) return;
            isSpinning = true;
            spinBtn.classList.add('disabled');
            statusMsg.innerText = "جاري تدوير العجلة الأسطورية... بالتوفيق! 🍀";

            // زوايا التوقف التقريبية لكل جائزة على صورتك
            const prizesAngles = {
                1000: 36,
                5000: 72,
                0: 108,    // Hard luck
                10: 144,
                150: 180,
                50: 216,
                250: 252,
                100: 288,
                20: 324,
                500: 360
            };

            let baseAngle = prizesAngles[targetPrize] || 252;
            const extraSpins = 360 * 6; // 6 دورات كاملة
            currentDegrees += extraSpins + (360 - (currentDegrees % 360)) + baseAngle;

            wheelImg.style.transform = `rotate(${currentDegrees}deg)`;

            setTimeout(() => {
                if (targetPrize > 0) {
                    statusMsg.style.color = "#00ffcc";
                    statusMsg.innerText = `🎉 مبروك! لقد ربحت ${targetPrize} NSP!`;
                } else {
                    statusMsg.style.color = "#ff6b6b";
                    statusMsg.innerText = "😔 حظ أوفر في المرة القادمة (Hard luck)!";
                }

                setTimeout(() => {
                    tg.sendData(JSON.stringify({
                        action: "wheel_spun",
                        prize: targetPrize
                    }));
                }, 2000);
            }, 4600);
        }
    </script>
</body>
</html>
