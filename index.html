<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>عجلة الأكوس شي</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        body {
            background-color: #0d0214;
            /* الصورة الكاملة تظهر كخلفية فخمة وثابتة للشاشة بالكامل */
            background-image: url('Ghan.jpg');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            overflow: hidden;
            cursor: pointer;
        }
        /* منطقة النصوص في الأسفل بشكل مرتب ومنفصل تماماً عن العجلة */
        .bottom-panel {
            width: 100%;
            background: linear-gradient(to top, rgba(13, 2, 20, 0.95) 70%, rgba(13, 2, 20, 0));
            padding: 15px 15px 25px;
            z-index: 10;
        }
        .title-sec {
            font-size: 20px;
            font-weight: 900;
            color: #ffcc00;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
            margin-bottom: 5px;
        }
        .status-msg {
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            line-height: 1.4;
            padding: 0 10px;
            min-height: 40px;
        }
    </style>
</head>
<body onclick="startSpin()">

    <div class="bottom-panel">
        <div class="title-sec">عجلة الاكوس شي 👑</div>
        <div id="statusMsg" class="status-msg">جاري تحميل البيانات...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const canSpin = urlParams.get('can_spin') === '1';
        const reason = urlParams.get('reason') || '';
        const targetPrize = parseFloat(urlParams.get('prize') || '0');

        const statusMsg = document.getElementById('statusMsg');

        if (!canSpin) {
            if (reason === 'used') {
                statusMsg.innerText = "لقد استنفذت عدد المرات المسموحة لليوم.";
            } else if (reason === 'no_deposit') {
                statusMsg.innerText = "ليتم منحك فرصة في عجلة الحظ، يجب عليك شحن حسابك أولاً.";
            } else {
                statusMsg.innerText = "لا تتوفر لديك محاولات حالياً.";
            }
            statusMsg.style.color = "#ff6b6b";
        } else {
            statusMsg.innerText = "اضغط في أي مكان على الشاشة لتدوير العجلة! 🍀";
        }

        let isSpinning = false;
        function startSpin() {
            if (!canSpin || isSpinning) return;
            isSpinning = true;
            statusMsg.style.color = "#ffffff";
            statusMsg.innerText = "جاري تدوير العجلة... بالتوفيق! 🍀";

            setTimeout(() => {
                if (targetPrize > 0) {
                    statusMsg.style.color = "#00ffcc";
                    statusMsg.innerText = `🎉 مبروك! لقد ربحت ${targetPrize} NSP!`;
                } else {
                    statusMsg.style.color = "#ff6b6b";
                    statusMsg.innerText = "😔 حظ أوفر في المرة القادمة (Hard luck)!";
                }

                setTimeout(() => {
                    tg.sendData(JSON.stringify({
                        action: "wheel_spun",
                        prize: targetPrize
                    }));
                }, 2000);
            }, 3000);
        }
    </script>
</body>
</html>
