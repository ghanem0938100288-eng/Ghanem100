<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>عجلة الأكوس شي</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        body {
            background-color: #0d0214;
            /* الخلفية الأسطورية ثابتة وتملأ الشاشة بالكامل وبشكل متناسق */
            background-image: url('Ghan.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            cursor: pointer;
        }
        /* طبقة تظليل خفيفة في الأسفل لقراءة النصوص بوضوح وتجنب التداخل */
        .bottom-overlay {
            width: 100%;
            background: linear-gradient(to top, rgba(13, 2, 20, 0.95) 60%, rgba(13, 2, 20, 0));
            padding: 20px 15px 25px;
            z-index: 10;
        }
        /* إطار العجلة المتحركة في المنتصف بدقة */
        .wheel-wrapper {
            position: relative;
            width: 75vw;
            height: 75vw;
            max-width: 310px;
            max-height: 310px;
            margin-top: 18vh;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0, 225, 255, 0.6);
            border: 3px solid rgba(255, 215, 0, 0.5);
        }
        /* القرص الداخلي الذي يدور فقط */
        .spinning-disc {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            transition: transform 4.5s cubic-bezier(0.15, 0.85, 0.15, 1);
        }
        .title-sec {
            font-size: 20px;
            font-weight: 900;
            color: #ffcc00;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
            margin-bottom: 5px;
        }
        .status-msg {
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            line-height: 1.4;
            padding: 0 10px;
        }
    </style>
</head>
<body onclick="startSpin()">

    <div class="wheel-wrapper">
        <!-- القرص الدوار في المنتصف -->
        <img id="wheelImg" class="spinning-disc" src="Ghan.jpg" alt="عجلة الأكوس شي">
    </div>

    <div class="bottom-overlay">
        <div class="title-sec">عجلة الاكوس شي 👑</div>
        <div id="statusMsg" class="status-msg">اضغط في أي مكان على الشاشة لتدوير العجلة! 🍀</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const canSpin = urlParams.get('can_spin') === '1';
        const reason = urlParams.get('reason') || '';
        const targetPrize = parseFloat(urlParams.get('prize') || '0');

        const statusMsg = document.getElementById('statusMsg');
        const wheelImg = document.getElementById('wheelImg');

        let currentDegrees = 0;
        let isSpinning = false;

        if (!canSpin) {
            if (reason === 'used') {
                statusMsg.innerText = "لقد استنفذت عدد المرات المسموحة لليوم.";
            } else if (reason === 'no_deposit') {
                statusMsg.innerText = "ليتم منحك فرصة في عجلة الحظ، يجب عليك شحن حسابك أولاً.";
            } else {
                statusMsg.innerText = "لا تتوفر لديك محاولات حالياً.";
            }
            statusMsg.style.color = "#ff6b6b";
        }

        function startSpin() {
            if (!canSpin || isSpinning) return;
            isSpinning = true;
            statusMsg.style.color = "#ffffff";
            statusMsg.innerText = "جاري تدوير العجلة... بالتوفيق! 🍀";

            const prizesAngles = {
                1000: 36,
                5000: 72,
                0: 108,    
                10: 144,
                150: 180,
                50: 216,
                250: 252,
                100: 288,
                20: 324,
                500: 360
            };

            let baseAngle = prizesAngles[targetPrize] || 252;
            const extraSpins = 360 * 6; 
            currentDegrees += extraSpins + (360 - (currentDegrees % 360)) + baseAngle;

            wheelImg.style.transform = `rotate(${currentDegrees}deg)`;

            setTimeout(() => {
                if (targetPrize > 0) {
                    statusMsg.style.color = "#00ffcc";
                    statusMsg.innerText = `🎉 مبروك! لقد ربحت ${targetPrize} NSP!`;
                } else {
                    statusMsg.style.color = "#ff6b6b";
                    statusMsg.innerText = "😔 حظ أوفر في المرة القادمة (Hard luck)!";
                }

                setTimeout(() => {
                    tg.sendData(JSON.stringify({
                        action: "wheel_spun",
                        prize: targetPrize
                    }));
                }, 2000);
            }, 4600);
        }
    </script>
</body>
</html>
