<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>عجلة الأكوس شي</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        body {
            background-color: #0d0214;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
        }
        .wheel-container {
            position: relative;
            width: 80vw;
            height: 80vw;
            max-width: 320px;
            max-height: 320px;
            margin-bottom: 20px;
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(0, 225, 255, 0.5);
            border: 5px solid #ffcc00;
        }
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 24px solid #ff3366;
            z-index: 10;
        }
        .title-sec {
            font-size: 22px;
            font-weight: 900;
            color: #ffcc00;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
            margin-bottom: 10px;
        }
        .status-msg {
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            padding: 0 20px;
            line-height: 1.4;
        }
    </style>
</head>
<body onclick="startSpin()">

    <div class="title-sec">عجلة الاكوس شي 👑</div>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="400" height="400"></canvas>
    </div>

    <div id="statusMsg" class="status-msg">اضغط في أي مكان على الشاشة لتدوير العجلة! 🍀</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const canSpin = urlParams.get('can_spin') === '1';
        const reason = urlParams.get('reason') || '';
        const targetPrize = parseFloat(urlParams.get('prize') || '0');

        const statusMsg = document.getElementById('statusMsg');
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');

        const sectors = [
            { label: "1000 NSP", color: "#4B0082" },
            { label: "5000 NSP", color: "#8A2BE2" },
            { label: "Hard Luck", color: "#483D8B" },
            { label: "10 NSP", color: "#6A5ACD" },
            { label: "150 NSP", color: "#7B68EE" },
            { label: "50 NSP", color: "#9370DB" },
            { label: "250 NSP", color: "#8B008B" },
            { label: "100 NSP", color: "#9932CC" },
            { label: "20 NSP", color: "#BA55D3" },
            { label: "500 NSP", color: "#DA70D6" }
        ];

        const arc = Math.PI / (sectors.length / 2);
        let currentAngle = 0;
        let isSpinning = false;

        function drawSector(sector, i) {
            const angle = arc * i;
            ctx.beginPath();
            ctx.fillStyle = sector.color;
            ctx.moveTo(200, 200);
            ctx.arc(200, 200, 200, angle, angle + arc, false);
            ctx.lineTo(200, 200);
            ctx.fill();
            ctx.save();

            ctx.translate(200, 200);
            ctx.rotate(angle + arc / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 20px Tahoma";
            ctx.fillText(sector.label, 180, 10);
            ctx.restore();
        }

        function drawWheel() {
            ctx.clearRect(0, 0, 400, 400);
            sectors.forEach(drawSector);
        }

        drawWheel();

        if (!canSpin) {
            if (reason === 'used') {
                statusMsg.innerText = "لقد استنفذت عدد المرات المسموحة لليوم.";
            } else if (reason === 'no_deposit') {
                statusMsg.innerText = "ليتم منحك فرصة في عجلة الحظ، يجب عليك شحن حسابك أولاً.";
            } else {
                statusMsg.innerText = "لا تتوفر لديك محاولات حالياً.";
            }
            statusMsg.style.color = "#ff6b6b";
        }

        function startSpin() {
            if (!canSpin || isSpinning) return;
            isSpinning = true;
            statusMsg.style.color = "#ffffff";
            statusMsg.innerText = "جاري تدوير العجلة... بالتوفيق! 🍀";

            // حساب الزاوية المطلوبة حسب الجائزة
            const prizeIndexMap = {
                1000: 0, 5000: 1, 0: 2, 10: 3, 150: 4,
                50: 5, 250: 6, 100: 7, 20: 8, 500: 9
            };
            
            let index = prizeIndexMap[targetPrize] !== undefined ? prizeIndexMap[targetPrize] : 2;
            const degreesPerSector = 360 / sectors.length;
            const targetAngle = 360 - (index * degreesPerSector) - (degreesPerSector / 2);
            
            const extraSpins = 360 * 6;
            const totalDegrees = currentAngle + extraSpins + (targetAngle - (currentAngle % 360));
            
            let startTime = null;
            const duration = 4500;

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                let progress = (timestamp - startTime) / duration;
                if (progress > 1) progress = 1;

                // Ease out cubic
                let easeProgress = 1 - Math.pow(1 - progress, 3);
                let currentDeg = currentAngle + (totalDegrees - currentAngle) * easeProgress;

                canvas.style.transform = `rotate(${currentDeg}deg)`;

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    currentAngle = totalDegrees;
                    isSpinning = false;

                    if (targetPrize > 0) {
                        statusMsg.style.color = "#00ffcc";
                        statusMsg.innerText = `🎉 مبروك! لقد ربحت ${targetPrize} NSP!`;
                    } else {
                        statusMsg.style.color = "#ff6b6b";
                        statusMsg.innerText = "😔 حظ أوفر في المرة القادمة (Hard luck)!";
                    }

                    setTimeout(() => {
                        tg.sendData(JSON.stringify({
                            action: "wheel_spun",
                            prize: targetPrize
                        }));
                    }, 2000);
                }
            }

            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
